<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de pesquisa</title>
    <link rel="stylesheet" href="estilos/formulario-pesquisa.css">
</head>

<body>
    <header></header>
    <main>
        <form>

            <div class="item-formulario coluna2">
                <label for="nome-completo">Nome Completo:</label>
                <input type="text" name="nome-completo" id="nome-completo" required>
            </div>

            <div class="item-formulario coluna2">
                <label for="email-do-usuario">E-mail:</label>
                <input type="email" name="email-do-usuario" id="email-do-usuario" required>
            </div>

            <div class="item-formulario coluna1">
                <label for="navegador">Qual é o seu navegador favorito?</label>
                <select name="navegador" id="navegador" required>
                    <option value="0">Nenhum</option>
                    <option value="1">Chrome</option>
                    <option value="2">Edge</option>
                    <option value="3">Safari</option>
                    <option value="4">DuckDuckGo</option>
                    <option value="5">Brave</option>
                </select>
            </div>

            <div class="item-formulario coluna1">
                <label for="pet">Você tem um bichinho de estimação em
                    casa?</label>
                <input type="checkbox" name="pet" id="pet">
            </div>

            <div class="item-formulario">
                <label for="feedback">Liste os lugares onde você morou:</label>
                <textarea name="feedback" id="feedback" rows="4"
                  placeholder="Brasil São Paulo, USA Utah, Canada Toronto"></textarea>
            </div>

            <button type="submit">Enviar Pesquisa</button>
        </form>
    </main>
    <footer></footer>
</body>

</html>
