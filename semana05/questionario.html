<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionário</title>
    <link rel="stylesheet" href="estilos/questionario.css">
</head>

<body>
    <header>
        <h1>Questionário de HTML e CSS</h1>
    </header>
    <main>
        <form>
            <div>
                <label>O que significa a sigla CSS?<input type="text" name="q1" id="q1"
                      required></label>
                <label for="q2">Como os atributos 'id' e 'class' são selecionados no CSS?</label>
                <textarea name="q2" id="q2" rows="3"></textarea>
                <label for="q3">Qual das opções abaixo é um comentário CSS válido?</label>
                <select name="q3" id="q3" required>
                    <option value="" selected disabled>Escolha uma...</option>
                    <option value="1">/* Este é um comentário CSS */</option>
                    <option value="2">// Este é um comentário CSS</option>
                    <option value="3">&lt;!-- Este é um comentário CSS --&gt;</option>
                </select>
                <label>Qual é a margem inferior dada por esta declaração?
                    <code>margin:10px 5px 15px;</code><input type="number" name="q4"
                      id="q4"></label>
                <button type="submit">Enviar</button>
            </div>
        </form>
    </main>
    <footer></footer>
</body>

</html>
