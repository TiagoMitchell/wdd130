<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Entre em contato com a Mitchell River Adventures para tirar dúvidas sobre nossas aventuras de rafting, reservas e serviços. Estamos prontos para ajudar!">
    <meta name="author" content="Tiago Mitchell">
    <title>Fale Conosco | Mitchell River Adventures</title>

    <link rel="stylesheet" href="estilos/rafting.css">
</head>

<body>
    <header>
        <img src="imagens/z-rapids-trees.png" alt="Logotipo de Mitchell River Adventures">

        <nav>
            <a href="index.html">Página Inicial</a>
            <a href="sobre.html">Sobre Nós</a>
            <a href="passeios.html">Passeios</a>
            <a href="contato.html">Fale Conosco</a>
        </nav>
    </header>

    <main>
        <h2>Entre em contato</h2>
        <div class="contato-info">
            <p><strong>Rua das Aventuras, 150, Brotas – SP</strong></p>
            <p><strong>(14) 3653-1234</strong></p>
            <p><strong>contato@mitchellriver.com.br</strong></p>
        </div>

        <div class="contato-layout">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d29535.14757932015!2d-48.14868000393229!3d-22.282025750744232!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94c779b1ef54476b%3A0x53ea79d1218530bb!2sBrotas%2C%20SP%2C%2017380-000!5e0!3m2!1spt-BR!2sbr!4v1795808049724!5m2!1spt-BR!2sbr"
              allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin">
            </iframe>

            <form>
                <div class="form-item">
                    <label for="nome-do-usuario">Nome</label>
                    <input type="text" name="nome" id="nome-do-usuario" required>
                </div>

                <div class="form-item">
                    <label for="e-mail-do-usuario">E-mail</label>
                    <input type="email" name="e-mail" id="e-mail-do-usuario" required>
                </div>

                <fieldset>
                    <legend>Finalidade da Mensagem</legend>

                    <input type="radio" name="finalidade" id="duvida-geral" value="duvida-geral">
                    <label for="duvida-geral">Consulta Geral</label>

                    <input type="radio" name="finalidade" id="pergunta-sobre-reserva"
                      value="pergunta-sobre-reserva">
                    <label for="pergunta-sobre-reserva">Pergunta sobre Reserva</label>

                    <input type="radio" name="finalidade" id="sugestao" value="sugestao">
                    <label for="sugestao">Sugestão de Site</label>
                </fieldset>

                <div class="form-item2">
                    <label for="mensagem-do-usuario">Mensagem</label>
                    <textarea name="mensagem" id="mensagem-do-usuario" rows="3"></textarea>
                </div>

                <div class="form-item1">
                    <input type="checkbox" name="newsletter" id="newsletter">
                    <label for="newsletter">Quero receber a newsletter mensal</label>
                </div>

                <button type="submit">Entrar em Contato</button>
            </form>
        </div>

        <section class="equipe">
            <h2>Estamos aqui para servi-lo</h2>

            <figure>
                <img src="imagens/Funcionário1.jpg" alt="Foto do funcionário 1">
                <figcaption>Jorge - Guia de rafting </figcaption>
            </figure>

            <figure>
                <img src="imagens/Funcionário3.jpg" alt="Foto do funcionário 2">
                <figcaption>Marcela - Guia líder</figcaption>
            </figure>

            <figure>
                <img src="imagens/funcionário2.jpg" alt="Foto do funcionário 3">
                <figcaption>Arthur - Técnico de equipamentos</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Mitchell River Adventures | Tiago Mitchell</p>

        <nav class="redes-sociais">
            <a href="https://facebook.com">
                <img src="imagens/facebook_254390.svg" alt="Facebook">
            </a>

            <a href="https://instagram.com">
                <img src="imagens/instagram_254393.svg" alt="Instagram">
            </a>

            <a href="https://youtube.com">
                <img src="imagens/youtube_254412.svg" alt="YouTube">
            </a>
        </nav>
    </footer>
</body>

</html>
